<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kinder 2 First Term Reviewer – Official Topics</title>
<style>
:root{--p:#4A90E2;--s:#27AE60;--a:#E74C3C;--u:#8E44AD;--t:#2C3E50;--ok:#27AE60;--no:#E74C3C;--sh:0 6px 16px rgba(0,0,0,.12);--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,#E3F2FD,#FFF8E1 50%,#F3E5F5);min-height:100vh;color:var(--t);padding-bottom:36px}
.screen{display:none;min-height:100vh;padding:14px;max-width:660px;margin:0 auto}
.screen.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hdr{text-align:center;padding:22px 10px 16px;background:linear-gradient(135deg,#4A90E2,#8E44AD);color:#fff;border-radius:0 0 24px 24px;margin:-14px -14px 16px;box-shadow:var(--sh)}
.hdr h1{font-size:1.55rem;margin-bottom:3px}
.hdr p{font-size:.9rem;opacity:.95}
.blk{background:#fff;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.ttl{font-size:1.2rem;font-weight:800;text-align:center;margin-bottom:10px;padding:9px;border-radius:11px;color:#fff}
.d1 .ttl{background:linear-gradient(90deg,#4A90E2,#5C6BC0)}
.d2 .ttl{background:linear-gradient(90deg,#27AE60,#1ABC9C)}
.d3 .ttl{background:linear-gradient(90deg,#E67E22,#D35400)}
.fn .ttl{background:linear-gradient(90deg,#E74C3C,#C0392B)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:#F8FBFF;border:3px solid #E3F2FD;border-radius:14px;padding:15px 8px;font-size:1rem;font-weight:700;color:var(--t);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:88px;justify-content:center}
.btn:active{transform:scale(.97)}
.btn .ic{font-size:1.7rem}
.btn small{font-size:.72rem;font-weight:500;opacity:.7}
.btn.full{grid-column:span 2}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:7px;flex-wrap:wrap}
.nav{background:#fff;border:2px solid #ddd;border-radius:11px;padding:8px 12px;font-size:.88rem;font-weight:600;cursor:pointer}
.prog{flex:1;min-width:90px;background:#E0E0E0;border-radius:20px;height:13px;overflow:hidden}
.bar{height:100%;background:linear-gradient(90deg,#4A90E2,#27AE60);width:0%;transition:width .3s;border-radius:20px}
.cnt{font-weight:700;font-size:.88rem;color:var(--p)}
.card{background:#fff;border-radius:var(--r);padding:18px 14px;box-shadow:var(--sh);margin-bottom:12px}
.qt{font-size:1.15rem;font-weight:600;line-height:1.4;margin-bottom:16px;text-align:center}
.chs{display:grid;gap:10px}
.ch{background:#F8FBFF;border:3px solid #D0E4FF;border-radius:13px;padding:13px 11px;font-size:1.05rem;font-weight:600;text-align:left;cursor:pointer;display:flex;align-items:center;gap:11px;min-height:52px}
.ch:active{transform:scale(.98)}
.ch.ok{border-color:var(--ok);background:#E8F8F0}
.ch.no{border-color:var(--no);background:#FDECEC}
.lt{background:var(--p);color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.ch.ok .lt{background:var(--ok)}
.ch.no .lt{background:var(--no)}
.fb{text-align:center;font-size:1.25rem;font-weight:700;margin:11px 0;min-height:32px;display:none}
.fb.show{display:block}
.fb.ok{color:var(--ok)}
.fb.no{color:var(--no)}
.nx{display:none;width:100%;background:linear-gradient(135deg,#4A90E2,#8E44AD);color:#fff;border:none;border-radius:14px;padding:15px;font-size:1.15rem;font-weight:800;cursor:pointer;box-shadow:var(--sh)}
.nx.show{display:block}
.sc{background:#fff;border-radius:20px;padding:26px 16px;text-align:center;box-shadow:var(--sh);margin-top:18px}
.sc h2{font-size:1.5rem;color:var(--p);margin-bottom:10px}
.sb{font-size:2.6rem;font-weight:800;color:var(--s);margin:8px 0}
.sd{font-size:1.05rem;margin:10px 0;line-height:1.55}
.sm{font-size:1.15rem;font-weight:700;margin:14px 0;color:var(--u)}
.sa{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.sa button{background:var(--p);color:#fff;border:none;border-radius:12px;padding:11px 18px;font-size:.95rem;font-weight:700;cursor:pointer}
@media(max-width:480px){.hdr h1{font-size:1.35rem}.qt{font-size:1.05rem}.ch{font-size:1rem;padding:11px 9px}}
</style>
</head>
<body>
<div id="home" class="screen active">
  <div class="hdr"><h1>🌟 Kinder 2 Reviewer</h1><p>First Term Examination • Official Topics</p></div>

  <div class="blk d1">
    <div class="ttl">📘 DAY 1</div>
    <div class="grid">
      <button class="btn" onclick="start('eng')"><span class="ic">📖</span>English<small>20 questions</small></button>
      <button class="btn" onclick="start('gmrc')"><span class="ic">✝️</span>GMRC / CLE<small>20 questions</small></button>
    </div>
  </div>

  <div class="blk d2">
    <div class="ttl">📗 DAY 2</div>
    <div class="grid">
      <button class="btn" onclick="start('math')"><span class="ic">🔢</span>Mathematics<small>20 questions</small></button>
      <button class="btn" onclick="start('fil')"><span class="ic">📝</span>Filipino<small>20 questions</small></button>
    </div>
  </div>

  <div class="blk d3">
    <div class="ttl">🔬 DAY 3</div>
    <div class="grid">
      <button class="btn full" onclick="start('sci')"><span class="ic">🌱</span>Science<small>20 questions • Plants</small></button>
    </div>
  </div>

  <div class="blk fn">
    <div class="ttl">🏆 FINAL QUIZZES</div>
    <div class="grid">
      <button class="btn full" onclick="start('mix1')"><span class="ic">🎯</span>Day 1 Mixed<small>English + GMRC • 20 questions</small></button>
      <button class="btn full" onclick="start('mix2')"><span class="ic">🎯</span>Day 2 Mixed<small>Math + Filipino • 20 questions</small></button>
      <button class="btn full" onclick="start('mix3')"><span class="ic">🎯</span>Day 3 Science Challenge<small>20 questions</small></button>
      <button class="btn full" onclick="start('final')"><span class="ic">🏅</span>All Topics Final<small>30 hard questions</small></button>
    </div>
  </div>
</div>

<div id="quiz" class="screen">
  <div class="top">
    <button class="nav" onclick="home()">🏠 Home</button>
    <div class="prog"><div class="bar" id="bar"></div></div>
    <span class="cnt" id="cnt">1 / 20</span>
  </div>
  <div class="card"><div class="qt" id="qt"></div><div class="chs" id="chs"></div></div>
  <div class="fb" id="fb"></div>
  <button class="nx" id="nx" onclick="next()">NEXT →</button>
</div>

<div id="score" class="screen">
  <div class="sc">
    <h2>⭐ Final Score</h2>
    <div class="sb" id="sb">0%</div>
    <div class="sd">Correct: <strong id="sc">0</strong> / <span id="st">0</span><br>Wrong: <strong id="sw">0</strong></div>
    <div class="sm" id="sm"></div>
    <div class="sa">
      <button onclick="restart()">🔄 Restart</button>
      <button onclick="home()">🏠 Home</button>
    </div>
  </div>
</div>

let bank=[], idx=0, score=0, done=false, key="";

function start(k){
  key=k; bank=[...Q[k]];
  for(let i=bank.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bank[i],bank[j]]=[bank[j],bank[i]];}
  idx=0; score=0; done=false;
  document.getElementById('home').classList.remove('active');
  document.getElementById('score').classList.remove('active');
  document.getElementById('quiz').classList.add('active');
  show();
}

function show(){
  done=false;
  const q=bank[idx];
  document.getElementById('qt').textContent=q.q;
  document.getElementById('fb').className='fb';
  document.getElementById('fb').textContent='';
  document.getElementById('nx').classList.remove('show');
  const chs=document.getElementById('chs');
  chs.innerHTML='';
  const L=['A','B','C','D'];
  q.c.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='ch';
    b.innerHTML=`<span class="lt">${L[i]}</span><span>${t}</span>`;
    b.onclick=()=>sel(i,b);
    chs.appendChild(b);
  });
  document.getElementById('bar').style.width=((idx/bank.length)*100)+'%';
  document.getElementById('cnt').textContent=`${idx+1} / ${bank.length}`;
}

function sel(i,b){
  if(done)return; done=true;
  const q=bank[idx];
  document.querySelectorAll('.ch').forEach(x=>x.style.pointerEvents='none');
  if(i===q.a){
    b.classList.add('ok'); score++;
    document.getElementById('fb').textContent='Correct! ⭐';
    document.getElementById('fb').className='fb show ok';
  }else{
    b.classList.add('no');
    document.querySelectorAll('.ch')[q.a].classList.add('ok');
    document.getElementById('fb').textContent='Try again! 😊  Correct: '+['A','B','C','D'][q.a];
    document.getElementById('fb').className='fb show no';
  }
  document.getElementById('nx').classList.add('show');
}

function next(){
  idx++;
  if(idx>=bank.length) end(); else show();
}

function end(){
  document.getElementById('quiz').classList.remove('active');
  document.getElementById('score').classList.add('active');
  const t=bank.length, p=Math.round((score/t)*100);
  document.getElementById('sb').textContent=p+'%';
  document.getElementById('sc').textContent=score;
  document.getElementById('st').textContent=t;
  document.getElementById('sw').textContent=t-score;
  let m='';
  if(p>=90)m='Excellent work! 🌟 You are a star!';
  else if(p>=75)m='Great job! Keep learning! 🌈';
  else if(p>=50)m='You are doing your best! 💪';
  else m='Nice try! Let’s practice again! 😊';
  document.getElementById('sm').textContent=m;
}

function restart(){start(key);}
function home(){
  document.getElementById('quiz').classList.remove('active');
  document.getElementById('score').classList.remove('active');
  document.getElementById('home').classList.add('active');
}
